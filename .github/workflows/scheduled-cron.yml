# Azure-native replacement for Vercel Cron (Frontend/vercel.json's `crons`
# block) — GitHub Actions' own `schedule:` trigger calls the Backend's
# cron endpoints DIRECTLY (Backend/src/routes/cron.ts), skipping the
# Frontend's pages/api/cron/* relay routes entirely: those only existed
# because Vercel Cron can only trigger routes within the same Vercel
# project, not arbitrary external URLs. An external scheduler has no such
# restriction, so this is one network hop shorter and one fewer thing that
# breaks if the Frontend deploy has issues.
#
# AUDIT NOTE (disabled 2026-09-07): both `schedule:` triggers below (and
# Frontend/vercel.json's matching `crons` block — see its own note) drove
# generate-blog-draft and scan-grant-opportunities on a fixed timer with no
# human trigger, both calling Gemini automatically and draining API quota
# unattended. Per explicit request, AI generation now only runs from a real
# admin action — the "✨ Generate" button in /admin/blog
# (POST /api/admin/blog/generate-ai, a completely separate route from the
# cron one below and unaffected by this). `schedule:` is commented out so
# these jobs no longer fire on their own; `workflow_dispatch` is kept so an
# admin can still run either one on demand from the Actions tab (Run
# workflow -> pick the job) — that's a deliberate human action, not a timer,
# so it stays enabled. To restore the automatic schedule, uncomment the
# `schedule:` block below and move Frontend/vercel.json's `crons` array back
# to its top-level key.
name: Scheduled Backend Cron Jobs

on:
  # schedule:
  #   # Mirrors vercel.json's generate-blog schedule exactly (Mon/Wed/Fri, 10:00 UTC).
  #   - cron: '0 10 * * 1,3,5'
  #   # Mirrors vercel.json's scan-grants schedule exactly (daily, 06:00 UTC).
  #   - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually'
        required: true
        type: choice
        options: [generate-blog-draft, scan-grant-opportunities]

jobs:
  generate-blog-draft:
    # Schedule triggers disabled (see the AUDIT NOTE above) — this now only
    # ever runs via an admin's explicit workflow_dispatch pick. The
    # github.event.schedule fallback is kept dormant (harmless once
    # `schedule:` is commented out above) so re-enabling it later is a
    # single uncomment, not a rewrite.
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'generate-blog-draft' || github.event.schedule == '0 10 * * 1,3,5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Backend blog-draft generation
        run: |
          curl -sf -X POST "${{ secrets.NEXT_PUBLIC_API_URL }}/cron/generate-blog-draft" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  scan-grant-opportunities:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'scan-grant-opportunities' || github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Backend grant-opportunity scan
        run: |
          curl -sf -X POST "${{ secrets.NEXT_PUBLIC_API_URL }}/cron/scan-grant-opportunities" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
