# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - cdc-api-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Backend is its own pnpm workspace (Backend/pnpm-lock.yaml,
      # Backend/pnpm-workspace.yaml) — same setup the Dockerfile / azure-pipelines.yml
      # already use for this service, so we mirror it here instead of the root lockfile.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        working-directory: Backend
        # node-linker=hoisted produces a flat, symlink-free node_modules.
        # pnpm's default symlinked layout (files pointing into a .pnpm store)
        # doesn't reliably survive the actions/upload-artifact -> download-artifact
        # -> azure/webapps-deploy zip round trip, which previously left the
        # deployed app with broken module resolution at runtime.
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Generate Prisma client
        working-directory: Backend
        # prisma generate validates the datasource url in schema.prisma even though
        # it doesn't connect to a DB, so a placeholder is enough at build time.
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
        run: pnpm exec prisma generate

      - name: Build backend
        working-directory: Backend
        run: pnpm run build

      - name: Remove dev dependencies
        working-directory: Backend
        run: pnpm prune --prod

      # prune re-materializes the hoisted node_modules from the lockfile, which
      # wipes node_modules/.prisma/client since it's generated output rather than
      # a locked package — regenerate it here so it's the last thing written
      # before packaging.
      - name: Regenerate Prisma client after prune
        working-directory: Backend
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
        run: pnpm exec prisma generate

      # node_modules/dist/prisma/package.json are collected into a flat deploy/
      # folder (mirrors the Dockerfile's runtime stage) so the zipped artifact is
      # exactly what `node dist/server.js` needs to run.
      - name: Package for deployment
        run: |
          mkdir -p deploy
          cp -r Backend/dist deploy/dist
          cp -r Backend/node_modules deploy/node_modules
          cp -r Backend/prisma deploy/prisma
          cp Backend/package.json deploy/package.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cdc-api-prod'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8F766A504D1F45FD9CE362EC6B224203 }}
