# Docs: https://github.com/Azure/login (OIDC), https://github.com/Azure/acr-build (az acr build)
#
# MANDATORY E2E GATE:
# Production deployment is triggered only after the "Nightly QA" workflow
# completes successfully on main. The exact SHA tested by QA is checked out,
# built into a container image, and deployed to the production Azure Web App.
#
# IMPORTANT:
# cdc-api-prod uses Azure App Service Site Containers.
# Therefore the production image must be updated with
# `az webapp sitecontainers update`, not the legacy
# `az webapp config container set` command.

name: Build and deploy container to Azure Web App - cdc-api-prod

on:
  workflow_run:
    workflows: ["Nightly QA"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: cdcplatformacr
  ACR_LOGIN_SERVER: cdcplatformacr.azurecr.io
  IMAGE_NAME: cdc-platform-backend
  WEBAPP_NAME: cdc-api-prod
  RESOURCE_GROUP: CDC-Prod-RG
  TARGET_PORT: "5000"

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image via ACR Tasks
        working-directory: Backend
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Point production Site Container at the new image
        run: |
          az webapp sitecontainers update \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --container-name main \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }} \
            --target-port ${{ env.TARGET_PORT }}

      - name: Verify production Site Container configuration
        run: |
          az webapp sitecontainers list \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[].{Name:name,Image:image,TargetPort:targetPort,IsMain:isMain}" \
            --output table

      - name: Restart production Web App to pull new image
        run: |
          az webapp restart \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}

      - name: Azure logout
        if: always()
        run: az logout
